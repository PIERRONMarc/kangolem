<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay Kangoulem — minimal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --noir:   #0B0B0B;
  --orange: #E8531F;
  --creme:  #F5F0E6;
  --s: 1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:transparent;
  overflow:hidden;
  display:grid;
  place-items:center;
}

/* fond de prévisualisation — masqué automatiquement dans OBS */
.preview{
  position:fixed; inset:0; z-index:0;
  background:radial-gradient(120% 90% at 20% 10%, #2a2118 0%, #120f0d 55%, #070706 100%);
}
body.obs .preview{display:none}

.stage{
  position:relative; z-index:1;
  width:1920px; height:1080px;
  transform:scale(var(--s));
}

.plaque{
  position:absolute; left:56px; bottom:56px;
  display:inline-flex; align-items:center;
  padding:28px 50px 32px 34px;
}
.plaque svg{
  position:absolute; inset:0; width:100%; height:100%;
  filter:url(#brosse);
}
.plaque .barre{
  position:relative; flex:none;
  width:11px; height:50px; margin-right:20px;
  background:var(--orange); filter:url(#brosse-fine);
}
.plaque b{
  position:relative;
  font-family:'Anton',Impact,Haettenschweiler,sans-serif;
  font-size:56px; line-height:.88; letter-spacing:.02em;
  text-transform:uppercase; color:var(--noir); white-space:nowrap;
}
</style>
</head>
<body>

<!-- ====== À MODIFIER ====== -->
<script>const PSEUDO = "Kaktus";</script>

<div class="preview"></div>

<div class="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="brosse" x="-20%" y="-40%" width="140%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.022 0.09" numOctaves="4" seed="12" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="brosse-fine" x="-10%" y="-25%" width="120%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="0.05 0.14" numOctaves="3" seed="5" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <path id="stroke" d="M9,17 C120,3 245,27 362,9 C424,0 472,15 497,6 L494,59 C432,68 381,52 320,60 C208,75 108,47 12,63 Z"/>
    </defs>
  </svg>

  <div class="plaque">
    <svg viewBox="0 0 500 70" preserveAspectRatio="none" aria-hidden="true">
      <use href="#stroke" fill="#F5F0E6"/>
    </svg>
    <i class="barre"></i>
    <b id="pseudo"></b>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
document.getElementById('pseudo').textContent = params.get('pseudo') || PSEUDO;

function fit(){
  document.documentElement.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080));
}
addEventListener('resize', fit);
fit();

if (!location.search.includes('preview')) document.querySelector('.preview').remove();
</script>
</body>
</html>
